[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "officeqa-rl"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.34.0,<2",
  # SpreadsheetBench v1/v2 workbook loading and grading.
  "openpyxl>=3.1",
  "tqdm>=4",
]

[project.optional-dependencies]
gemini = [
  "google-genai",
  "pillow>=10",
]
inference = [
  "google-auth>=2",
  "google-genai",
  "pillow>=10",
  "pypdfium2>=5,<6",
  "vllm>=0.11.0",
]
training = [
  "aiohttp>=3.9",
]
# JobBench: the vendored mini-swe-agent harness plus the host-side judge, which
# extracts deliverable text from xlsx/docx/pdf/pptx before scoring rubrics.
jobbench = [
  "jinja2>=3",
  "mammoth>=1.7",
  "openai>=1.40",
  "pandas>=2",
  "pdfplumber>=0.11",
  "platformdirs>=4",
  "pydantic>=2",
  "python-dotenv>=1",
  "python-pptx>=1",
  "rich>=13",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "aiohttp>=3.9",
  "jinja2>=3",
  "pillow>=10",
  "platformdirs>=4",
  "pydantic>=2",
  "pypdfium2>=5,<6",
  "python-dotenv>=1",
  "rich>=13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "api: opt-in test requiring external API credentials",
  "gpu: opt-in test requiring a local model checkpoint and GPU",
]
